<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记 - Pawvelle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
    <main class="window">
        <div class="browser-bar">
            <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="address" aria-hidden="true">pawvelle.github.io/notes</div>
            <a class="back-chip" href="index.html" aria-label="返回首页">&larr; 首页</a>
        </div>

        <article class="detail">
            <div class="crumbs"><a href="index.html">首页</a> / 笔记</div>

            <header class="detail-header reveal">
                <span class="eyebrow">笔记本</span>
                <h1>笔记</h1>
                <p class="lede">一个轻量的小本子，用来放学习记录、写作碎片，以及那些还需要一点结构才能变成作品的想法。</p>
            </header>

            <section class="panel-grid">
                <section class="panel reveal" id="llm-notes">
                    <div class="panel-head">
                        <h2>LLM 笔记</h2>
                        <span class="note">持续更新</span>
                    </div>
                    <p>记录微调笔记、提示词模式、评估习惯和语言模型小实验。重点是认真迭代，而不是追逐一闪而过的演示。</p>
                    <div class="tag-group">
                        <span class="tag peach">LLM</span>
                        <span class="tag">微调</span>
                        <span class="tag">评估</span>
                    </div>
                </section>

                <section class="panel reveal" id="writing">
                    <div class="panel-head">
                        <h2>写作</h2>
                        <span class="note">最近</span>
                    </div>
                    <p>关于机器学习、软件工具、视觉系统和日常观察的短札。把技术工作里容易忘记的小发现，存成更容易回看的样子。</p>
                    <div class="tag-group">
                        <span class="tag mint">短文</span>
                        <span class="tag">草稿</span>
                        <span class="tag">学习</span>
                    </div>
                </section>

                <section class="panel reveal">
                    <div class="panel-head">
                        <h2>分区</h2>
                        <span class="note">索引</span>
                    </div>
                    <div class="inline-row">
                        <a class="inline-link" href="#llm-notes">
                            <span class="il-label">小语言模型微调</span>
                            <span class="il-value">研究笔记</span>
                            <span class="chev">&rsaquo;</span>
                        </a>
                        <a class="inline-link" href="#writing">
                            <span class="il-label">随手札记和短文</span>
                            <span class="il-value">写作书架</span>
                            <span class="chev">&rsaquo;</span>
                        </a>
                    </div>
                </section>
            </section>

            <a class="back-home reveal" href="index.html">&larr; 回到首页</a>
        </article>
    </main>
</div>

<script>
    const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) {
                entry.target.classList.add('in');
                revealObserver.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal').forEach((el, index) => {
        el.style.transitionDelay = `${Math.min(index * 60, 220)}ms`;
        revealObserver.observe(el);
    });
</script>
</body>
</html>
